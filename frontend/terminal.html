<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonriv · SSH 终端</title>
<link rel="stylesheet" href="/static/vendor/xterm.min.css?v=4.38.7">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #1a1a1a; color: #e0e0e0; font-family: 'SF Mono','Cascadia Code','Consolas',monospace; overflow: hidden; }
  .term-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: #252525; border-bottom: 1px solid #333; font-size: 12px; flex-shrink: 0; }
  .term-header .title { color: #00d4ff; font-weight: 600; }
  .term-header .status { color: #888; flex: 1; }
  .term-header .btn { background: #333; color: #ddd; border: 1px solid #444; padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .term-header .btn:hover { background: #444; }
  .term-header .btn-primary { background: #0066aa; border-color: #0077bb; }
  .term-header .btn-primary:hover { background: #0077bb; }
  #terminal { flex: 1; overflow: hidden; padding: 4px; }
  .term-container { display: flex; flex-direction: column; height: 100vh; }
  .conn-form { padding: 8px 12px; background: #222; border-bottom: 1px solid #333; font-size: 11px; display: none; }
  .conn-form.show { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .conn-form input, .conn-form select { background: #1a1a1a; color: #e0e0e0; border: 1px solid #444; padding: 3px 6px; border-radius: 3px; font-size: 11px; }
  .conn-form label { color: #888; }
</style>
<script>
/* 读取主界面主题偏好(rp_theme)同步到本页 (仅 明亮/暗黑; 旧科技主题值回退) */
try{
  var _t = localStorage.getItem('rp_theme') || 'dark';
  if (_t === 'auto'){ _t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }
  document.documentElement.setAttribute('data-theme', _t);
}catch(_){}
</style>
</head>
<body>
<div class="term-container">
  <div class="term-header">
    <span class="title">🖥 SSH 终端</span>
    <span class="status" id="termStatus">未连接</span>
    <button class="btn" id="connToggleBtn" onclick="toggleConnForm()">⚙ 配置</button>
    <button class="btn btn-primary" onclick="TermDetached.connect()">🔌 连接</button>
    <button class="btn" onclick="TermDetached.disconnect()">⏹ 断开</button>
  </div>
  <div class="conn-form" id="connForm">
    <label>主机</label><input type="text" id="dHost" placeholder="192.168.1.100">
    <label>端口</label><input type="text" id="dPort" value="22" style="width:50px">
    <label>用户</label><input type="text" id="dUser" value="root" style="width:80px">
    <label>认证</label>
    <select id="dAuthType" onchange="updateDetachedAuthUI()">
      <option value="pass">密码</option>
      <option value="key">SSH 密钥</option>
    </select>
    <span id="dAuthField"><input type="password" id="dAuthValue" placeholder="密码"></span>
  </div>
  <div id="terminal"></div>
</div>

<script src="/static/vendor/xterm.min.js?v=4.38.7"></script>
<script>
// xterm 配色随界面主题: 浅色(light)用亮色终端, 其余保持深色
function RPXtermTheme(){
  try{
    var _t = document.documentElement.getAttribute('data-theme');
    if (_t === 'light'){
      return { background:'#ffffff', foreground:'#0f172a', cursor:'#2563eb', cursorAccent:'#ffffff',
               selectionBackground:'rgba(37,99,235,.22)' };
    }
  }catch(e){}
  return { background:'#0f1117', foreground:'#e8edf5', cursor:'#38bdf8' };
}
</script>
<script>
// v4.38.7: 分离终端独立窗口逻辑
var term = null;
var termTaskId = null;
var XTermCtor = window.Terminal;  // xterm.js 的 Terminal 构造器
var attaching = false;  // v4.38.9: attach 进行中标志

// v4.38.9: task_id 持久化（分离窗口用独立 key，避免与主窗口冲突）
function saveTaskId(id){
  try { localStorage.setItem('term_detach_task_id', id); } catch(e){}
}
function clearTaskId(){
  try { localStorage.removeItem('term_detach_task_id'); } catch(e){}
  termTaskId = null;
}
function getSavedTaskId(){
  try { return localStorage.getItem('term_detach_task_id') || ''; } catch(e){ return ''; }
}

function toggleConnForm(){
  var f = document.getElementById('connForm');
  f.classList.toggle('show');
}

function updateDetachedAuthUI(){
  var t = document.getElementById('dAuthType').value;
  var f = document.getElementById('dAuthField');
  if(t === 'pass'){
    f.innerHTML = '<input type="password" id="dAuthValue" placeholder="密码">';
  } else {
    f.innerHTML = '<input type="text" id="dAuthValue" placeholder="~/.ssh/id_rsa" value="~/.ssh/id_rsa">';
    f.innerHTML += '<button type="button" onclick="browseKeyFile()" title="浏览本地私钥文件" style="margin-left:4px;background:#333;color:#ddd;border:1px solid #444;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px">📁</button>';
    f.innerHTML += '<input type="password" id="dPassphrase" placeholder="密钥短语(可选)" style="margin-left:4px">';
  }
}

// v4.38.8: 本地私钥文件浏览
var bkCurrentPath = '/root/.ssh/';
function browseKeyFile(){
  var existing = document.getElementById('bkModal');
  if(existing) existing.remove();
  var modal = document.createElement('div');
  modal.id = 'bkModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:10000;display:flex;justify-content:center;align-items:center';
  modal.innerHTML =
    '<div style="background:#252525;border-radius:8px;width:560px;max-height:70vh;display:flex;flex-direction:column;border:1px solid #333;box-shadow:0 20px 60px rgba(0,0,0,0.5)">' +
      '<div style="padding:10px 14px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center">' +
        '<span style="color:#00d4ff;font-weight:600;font-size:13px">📁 选择 SSH 私钥文件</span>' +
        '<button onclick="document.getElementById(\'bkModal\').remove()" style="background:none;border:none;color:#888;font-size:16px;cursor:pointer">✕</button>' +
      '</div>' +
      '<div style="padding:8px 14px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;gap:6px;align-items:center">' +
        '<span id="bkPath" style="flex:1;font-family:monospace;font-size:11px;color:#00d4ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">/root/.ssh/</span>' +
        '<button onclick="bkGoUp()" style="background:#333;color:#ddd;border:1px solid #444;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px">⬆ 上级</button>' +
        '<button onclick="bkReload()" style="background:#333;color:#ddd;border:1px solid #444;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px">🔄</button>' +
      '</div>' +
      '<div id="bkList" style="flex:1;overflow-y:auto;padding:6px;min-height:280px;max-height:50vh"></div>' +
      '<div style="padding:8px 14px;border-top:1px solid #333;text-align:right">' +
        '<button onclick="document.getElementById(\'bkModal\').remove()" style="background:#333;color:#ddd;border:1px solid #444;padding:4px 12px;border-radius:3px;cursor:pointer;font-size:12px">取消</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  bkLoadDir('/root/.ssh/');
}
function bkLoadDir(path){
  bkCurrentPath = path;
  var pathEl = document.getElementById('bkPath');
  var listEl = document.getElementById('bkList');
  if(pathEl) pathEl.textContent = path;
  if(listEl) listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#888">加载中...</div>';
  wsSend({action: 'list_dir', path: path});
}
function bkGoUp(){
  if(bkCurrentPath === '/' || bkCurrentPath.length < 2) return;
  var parts = bkCurrentPath.replace(/\/$/, '').split('/');
  parts.pop();
  var parent = parts.join('/') || '/';
  if(!parent.endsWith('/')) parent += '/';
  bkLoadDir(parent);
}
function bkReload(){ bkLoadDir(bkCurrentPath); }
window.browseKeyFile = browseKeyFile;
window.bkGoUp = bkGoUp;
window.bkReload = bkReload;

// 编码密码（与主页面 encodePassword 一致：ENC: + base64）
function encodePassword(plain){
  try { return 'ENC:' + btoa(unescape(encodeURIComponent(plain))); }
  catch(e){ return plain; }
}

function getDetachedConn(){
  var t = document.getElementById('dAuthType').value;
  var val = document.getElementById('dAuthValue').value || '';
  var pp = '';
  var ppEl = document.getElementById('dPassphrase');
  if(ppEl) pp = ppEl.value || '';
  return {
    host: document.getElementById('dHost').value || '',
    port: document.getElementById('dPort').value || '22',
    user: document.getElementById('dUser').value || 'root',
    auth_type: t,
    password: t === 'pass' ? encodePassword(val) : '',
    key: t === 'key' ? encodePassword(val) : '',
    passphrase: t === 'key' ? encodePassword(pp) : '',
  };
}

// WebSocket 管理
var ws = null;
var wsHandlers = [];

function ensureWs(callback){
  if(ws && ws.readyState === WebSocket.OPEN){
    callback(ws);
    return;
  }
  // 获取 auth_token
  var token = '';
  try { token = sessionStorage.getItem('auth_token') || localStorage.getItem('auth_token') || ''; } catch(e){}
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws?auth_token=' + encodeURIComponent(token));
  ws.onopen = function(){ callback(ws); };
  ws.onmessage = function(event){
    try {
      var d = JSON.parse(event.data);
      wsHandlers.forEach(function(h){ try{ h(d); }catch(e){} });
    } catch(e){}
  };
  ws.onclose = function(){
    var st = document.getElementById('termStatus');
    if(st){ st.textContent = '连接断开'; st.style.color = '#f44'; }
  };
  ws.onerror = function(){};
}

function wsSend(data){
  data.req_id = 'r' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
  try { data.auth_token = sessionStorage.getItem('auth_token') || localStorage.getItem('auth_token') || ''; } catch(e){}
  ensureWs(function(w){ w.send(JSON.stringify(data)); });
}

// 安装终端消息处理器
wsHandlers.push(function(d){
  if(d.type === 'term_started'){
    termTaskId = d.task_id;
    saveTaskId(termTaskId);  // v4.38.9: 持久化
    attaching = false;
    var st = document.getElementById('termStatus');
    st.textContent = '已连接: ' + (d.host || '');
    st.style.color = '#4f4';
    if(term) term.focus();
  } else if(d.type === 'term_out'){
    if(term && d.data) term.write(d.data);
  } else if(d.type === 'term_closed'){
    if(term) term.write('\r\n\x1b[31m--- 终端已关闭 ---\x1b[0m\r\n');
    var st2 = document.getElementById('termStatus');
    st2.textContent = '已断开';
    st2.style.color = '#888';
    clearTaskId();  // v4.38.9: 清除持久化
  } else if(d.type === 'term_result' && d.status === 'error'){
    var wasAttaching = attaching;
    if(attaching){
      attaching = false;
      clearTaskId();
    }
    var st3 = document.getElementById('termStatus');
    st3.textContent = '错误: ' + (d.msg || '');
    st3.style.color = '#f44';
    // v4.38.9: attach 失败，自动 fallback 到新建连接
    if(wasAttaching){
      var savedConn = sessionStorage.getItem('term_detach_conn');
      if(savedConn){
        setTimeout(function(){ TermDetached.connect(); }, 200);
      }
    }
  } else if(d.type === 'dir_result'){
    // v4.38.8: 本地目录浏览响应
    var bkList = document.getElementById('bkList');
    if(!bkList) return;  // modal 已关闭
    if(d.status !== 'ok'){
      bkList.innerHTML = '<div style="padding:20px;text-align:center;color:#f44">' + (d.msg || '读取失败') + '</div>';
      return;
    }
    var pathEl = document.getElementById('bkPath');
    if(pathEl) pathEl.textContent = d.path;
    bkList.innerHTML = '';
    if(!d.entries || d.entries.length === 0){
      bkList.innerHTML = '<div style="padding:20px;text-align:center;color:#888">空目录</div>';
      return;
    }
    d.entries.forEach(function(entry){
      var row = document.createElement('div');
      row.style.cssText = 'padding:5px 10px;border-radius:4px;display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer';
      row.onmouseenter = function(){ row.style.background = 'rgba(255,255,255,0.05)'; };
      row.onmouseleave = function(){ row.style.background = ''; };
      var isDir = entry.type === 'dir';
      var icon = isDir ? '📁' : '📄';
      var color = isDir ? '#bb86fc' : '#e0e0e0';
      var name = entry.name === '..' ? '📁 .. (上级)' : icon + ' ' + entry.name;
      row.innerHTML = '<span style="flex:1;color:' + color + '">' + name + '</span>';
      if(isDir){
        row.onclick = function(){ bkLoadDir(entry.path); };
      } else {
        row.onclick = function(){
          var valEl = document.getElementById('dAuthValue');
          if(valEl) valEl.value = entry.path;
          var modal = document.getElementById('bkModal');
          if(modal) modal.remove();
        };
      }
      bkList.appendChild(row);
    });
  }
});

// 终端尺寸自适应
function fitTerm(){
  if(!term) return;
  var el = document.getElementById('terminal');
  var cellW = 7.2, cellH = 17;
  var cols = Math.max(20, Math.floor((el.clientWidth - 8) / cellW));
  var rows = Math.max(5, Math.floor((el.clientHeight - 8) / cellH));
  if(term.cols !== cols || term.rows !== rows){
    term.resize(cols, rows);
    if(termTaskId) wsSend({action:'terminal_resize', task_id: termTaskId, rows: rows, cols: cols});
  }
}

window.addEventListener('resize', function(){ if(term) setTimeout(fitTerm, 100); });

var TermDetached = {
  connect: function(){
    var conn = getDetachedConn();
    if(!conn.host){ alert('请填写主机地址'); return; }

    if(!term){
      term = new XTermCtor({
        cursorBlink: true, fontSize: 13, fontFamily: 'monospace',
        theme: RPXtermTheme(),
        rows: 24, cols: 80,
      });
      term.open(document.getElementById('terminal'));
      term.onData(function(data){
        if(termTaskId) wsSend({action:'terminal_input', task_id: termTaskId, data: data});
      });
      setTimeout(fitTerm, 50);
    }

    var st = document.getElementById('termStatus');
    st.textContent = '连接中...';
    st.style.color = '#888';

    wsSend({
      action: 'terminal_open',
      host: conn.host, port: conn.port || 22, user: conn.user || 'root',
      auth_type: conn.auth_type,
      password: conn.password, key: conn.key, passphrase: conn.passphrase,
      rows: term.rows, cols: term.cols,
    });
  },

  disconnect: function(){
    if(termTaskId){
      wsSend({action:'terminal_close', task_id: termTaskId});
      clearTaskId();  // v4.38.9: 用户主动断开，清除持久化
    }
    if(term) term.write('\r\n\x1b[33m--- 已断开 ---\x1b[0m\r\n');
    var st = document.getElementById('termStatus');
    st.textContent = '已断开';
    st.style.color = '#888';
  },
};

// v4.38.9: 创建 xterm 实例（供 attach 和 connect 共用）
function ensureTerm(){
  if(term) return true;
  var el = document.getElementById('terminal');
  if(!el || !XTermCtor) return false;
  term = new XTermCtor({
    cursorBlink: true, fontSize: 13, fontFamily: 'monospace',
    theme: RPXtermTheme(),
    rows: 24, cols: 80,
  });
  term.open(el);
  term.onData(function(data){
    if(termTaskId) wsSend({action:'terminal_input', task_id: termTaskId, data: data});
  });
  setTimeout(fitTerm, 50);
  return true;
}

// v4.38.9: 尝试恢复上次的终端会话（刷新页面后自动重连）
function tryAttach(){
  var savedTaskId = getSavedTaskId();
  if(!savedTaskId) return false;
  if(!ensureTerm()) return false;
  attaching = true;
  var st = document.getElementById('termStatus');
  st.textContent = '恢复会话中...';
  st.style.color = '#888';
  wsSend({action: 'terminal_attach', task_id: savedTaskId});
  return true;
}

// 页面加载时从 sessionStorage 读取主窗口传来的连接配置
(function init(){
  try {
    var saved = sessionStorage.getItem('term_detach_conn');
    if(saved){
      var conn = JSON.parse(saved);
      document.getElementById('dHost').value = conn.host || '';
      document.getElementById('dPort').value = conn.port || '22';
      document.getElementById('dUser').value = conn.user || 'root';
      document.getElementById('dAuthType').value = conn.auth_type || 'pass';
      updateDetachedAuthUI();
      // v4.38.8: 回填原始值（密钥路径/密码/passphrase），支持自动连接
      var valEl = document.getElementById('dAuthValue');
      if(valEl && conn.rawValue) valEl.value = conn.rawValue;
      if(conn.auth_type === 'key'){
        var ppEl = document.getElementById('dPassphrase');
        if(ppEl && conn.rawPassphrase) ppEl.value = conn.rawPassphrase;
      }
      // v4.38.9: 优先恢复上次会话，失败则新建连接
      setTimeout(function(){
        if(!tryAttach()){
          TermDetached.connect();
        }
      }, 300);
    }
  } catch(e){}

  // 从 URL query 或 localStorage 取 token
  var urlToken = new URLSearchParams(location.search).get('auth_token');
  if(urlToken){
    try { sessionStorage.setItem('auth_token', urlToken); } catch(e){}
  }
})();
</script>
</body>
</html>
